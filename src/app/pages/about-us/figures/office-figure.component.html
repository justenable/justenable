<!--
  Draw-in (styles/components.scss, .figure.is-revealed): every stroked
  element carries pathLength="1" and its place in the drawing order in --i
  (60 ms apart, 700 ms each). The plan is drawn the way it would be
  surveyed: desks, court, braai, then the north arrow. --steps is the last
  index, so --draw-end (figure.scss) covers the slowest line; the coals and
  the tags follow it.
-->
<svg aria-hidden="true" class="h-auto w-full" viewBox="0 0 480 288" style="--steps: 25">
  <!-- Desks: three bench pairs with a chair at each place -->
  <g>
    <rect class="figure-line" x="32" y="64" width="112" height="32" rx="2" pathLength="1" style="--i: 0" />
    <line class="figure-line" x1="88" y1="64" x2="88" y2="96" pathLength="1" style="--i: 1" />
    <circle class="figure-line" cx="60" cy="108" r="8" pathLength="1" style="--i: 2" />
    <circle class="figure-line" cx="116" cy="108" r="8" pathLength="1" style="--i: 2" />

    <rect class="figure-line" x="32" y="128" width="112" height="32" rx="2" pathLength="1" style="--i: 3" />
    <line class="figure-line" x1="88" y1="128" x2="88" y2="160" pathLength="1" style="--i: 4" />
    <circle class="figure-line" cx="60" cy="172" r="8" pathLength="1" style="--i: 5" />
    <circle class="figure-line" cx="116" cy="172" r="8" pathLength="1" style="--i: 5" />

    <rect class="figure-line" x="32" y="192" width="112" height="32" rx="2" pathLength="1" style="--i: 6" />
    <line class="figure-line" x1="88" y1="192" x2="88" y2="224" pathLength="1" style="--i: 7" />
    <circle class="figure-line" cx="60" cy="236" r="8" pathLength="1" style="--i: 8" />
    <circle class="figure-line" cx="116" cy="236" r="8" pathLength="1" style="--i: 8" />
  </g>
  <text class="figure-tag" x="88" y="264" text-anchor="middle">DESKS</text>

  <!-- Half court: centre circle at the half-way line, three-point line, key, free-throw arc, backboard and hoop -->
  <g>
    <rect class="figure-line" x="176" y="64" width="176" height="176" pathLength="1" style="--i: 9" />
    <path class="figure-line" d="M240 64a24 24 0 0 0 48 0" pathLength="1" style="--i: 10" />
    <path class="figure-line" d="M192 240v-32a72 72 0 0 1 144 0v32" pathLength="1" style="--i: 11" />
    <rect class="figure-line" x="240" y="176" width="48" height="64" pathLength="1" style="--i: 12" />
    <path class="figure-line" d="M240 176a24 24 0 0 1 48 0" pathLength="1" style="--i: 13" />
    <line class="figure-line" x1="248" y1="232" x2="280" y2="232" pathLength="1" style="--i: 14" />
    <circle class="figure-line" cx="264" cy="222" r="6" pathLength="1" style="--i: 15" />
  </g>
  <text class="figure-tag" x="264" y="264" text-anchor="middle">COURT</text>

  <!-- Braai: the drum, the coals (lit) and the grid over them -->
  <g>
    <circle class="figure-line" cx="416" cy="152" r="36" pathLength="1" style="--i: 16" />
    <circle class="figure-accent" cx="416" cy="152" r="12" />
    <line class="figure-line" x1="391" y1="128" x2="441" y2="128" pathLength="1" style="--i: 17" />
    <line class="figure-line" x1="386" y1="136" x2="446" y2="136" pathLength="1" style="--i: 18" />
    <line class="figure-line" x1="383" y1="144" x2="449" y2="144" pathLength="1" style="--i: 19" />
    <line class="figure-line" x1="382" y1="152" x2="450" y2="152" pathLength="1" style="--i: 20" />
    <line class="figure-line" x1="383" y1="160" x2="449" y2="160" pathLength="1" style="--i: 21" />
    <line class="figure-line" x1="386" y1="168" x2="446" y2="168" pathLength="1" style="--i: 22" />
    <line class="figure-line" x1="391" y1="176" x2="441" y2="176" pathLength="1" style="--i: 23" />
  </g>
  <text class="figure-tag" x="416" y="264" text-anchor="middle">BRAAI</text>

  <!-- North arrow -->
  <line class="figure-line" x1="448" y1="72" x2="448" y2="40" pathLength="1" style="--i: 24" />
  <path class="figure-line" d="M442 46l6-6 6 6" pathLength="1" style="--i: 25" />
  <text class="figure-tag" x="448" y="32" text-anchor="middle">N</text>
</svg>
