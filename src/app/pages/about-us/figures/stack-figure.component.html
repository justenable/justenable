<!--
  Draw-in (styles/components.scss, .figure.is-revealed): every solid stroke
  carries pathLength="1" and its place in the drawing order in --i (60 ms
  apart, 700 ms each). The stack is built from the ground up: field, then
  control, then digital. --steps is the last index, so --draw-end
  (figure.scss) covers the slowest line; the signals, the measurement in
  flight and the tags follow it.
-->
<svg aria-hidden="true" class="h-auto w-full" viewBox="0 0 480 288" style="--steps: 12">
  <!-- Field: a motor and a transmitter on its stem -->
  <text class="figure-tag" x="16" y="269">FIELD</text>
  <line class="figure-line" x1="96" y1="264" x2="464" y2="264" pathLength="1" style="--i: 0" />
  <g>
    <circle class="figure-line" cx="176" cy="244" r="20" pathLength="1" style="--i: 1" />
    <text class="figure-tag" x="176" y="249" text-anchor="middle">M</text>
    <rect class="figure-line" x="216" y="216" width="32" height="24" rx="3" pathLength="1" style="--i: 2" />
    <line class="figure-line" x1="232" y1="240" x2="232" y2="264" pathLength="1" style="--i: 3" />
  </g>

  <!-- Control: the PLC and the SCADA it reports to -->
  <text class="figure-tag" x="16" y="181">CONTROL</text>
  <line class="figure-line" x1="96" y1="176" x2="464" y2="176" pathLength="1" style="--i: 4" />
  <g>
    <rect class="figure-line" x="160" y="128" width="88" height="48" rx="3" pathLength="1" style="--i: 5" />
    <text class="figure-tag" x="204" y="157" text-anchor="middle">PLC</text>
    <rect class="figure-line" x="320" y="128" width="88" height="48" rx="3" pathLength="1" style="--i: 6" />
    <text class="figure-tag" x="364" y="157" text-anchor="middle">SCADA</text>
  </g>

  <!-- Digital: an app window and the cloud it talks to -->
  <text class="figure-tag" x="16" y="93">DIGITAL</text>
  <line class="figure-line" x1="96" y1="88" x2="464" y2="88" pathLength="1" style="--i: 7" />
  <g>
    <rect class="figure-line" x="160" y="32" width="88" height="56" rx="3" pathLength="1" style="--i: 8" />
    <line class="figure-line" x1="160" y1="48" x2="248" y2="48" pathLength="1" style="--i: 9" />
    <line class="figure-line" x1="176" y1="64" x2="232" y2="64" pathLength="1" style="--i: 10" />
    <line class="figure-line" x1="176" y1="72" x2="216" y2="72" pathLength="1" style="--i: 11" />
    <path class="figure-line" d="M392 88a16 16 0 1 0-8.2-29.5a32 32 0 1 0-31.8 29.5z" pathLength="1" style="--i: 12" />
  </g>

  <!-- Signals: field to PLC, PLC to SCADA, SCADA to the cloud, cloud to the app.
       Dashed, so they cannot draw: they fade in (figure.scss) once the layers stand. -->
  <g class="figure-dashed" stroke-dasharray="2 4">
    <line class="figure-line" x1="176" y1="224" x2="176" y2="176" />
    <line class="figure-line" x1="232" y1="216" x2="232" y2="176" />
    <line class="figure-line" x1="248" y1="152" x2="320" y2="152" />
    <line class="figure-line" x1="364" y1="128" x2="364" y2="88" />
    <line class="figure-line" x1="248" y1="56" x2="320" y2="56" />
  </g>
  <!-- The measurement in flight between the field and control layers -->
  <circle class="figure-accent" cx="232" cy="196" r="5" />
</svg>
