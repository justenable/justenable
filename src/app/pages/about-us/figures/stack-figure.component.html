<svg aria-hidden="true" class="h-auto w-full" viewBox="0 0 480 288">
  <!-- Digital: an app window and the cloud it talks to -->
  <text class="figure-tag" x="16" y="93">DIGITAL</text>
  <line class="figure-line" x1="96" y1="88" x2="464" y2="88" />

  <text class="figure-tag" x="16" y="181">CONTROL</text>

  <g stroke-dasharray="2 4">
