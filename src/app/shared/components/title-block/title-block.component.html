<div class="section">
  <div class="container-x">
    <div class="lg:grid lg:grid-cols-12">
      <div class="lg:col-span-9">
        <p class="eyebrow">
          @if (tag) {
            <span class="tag text-ink-muted">{{ tag }}</span><span aria-hidden="true"> · </span>
          }
          {{ eyebrowKey | translate }}
        </p>
        <h1 class="mt-3 font-display text-display-l text-ink">
          {{ titleKey | translate: titleParams }}
        </h1>
        <div class="my-4 h-[3px] w-16 bg-accent" aria-hidden="true"></div>
        @if (leadKey) {
          <p class="max-w-[68ch] text-lead text-ink-muted">
            {{ leadKey | translate: leadParams }}
          </p>
        }
      </div>
    </div>
    @if (contents?.length) {
      <nav class="mt-6 xl:hidden" [attr.aria-label]="'A11Y.CONTENTS' | translate">
        <ul class="flex flex-wrap gap-x-6 gap-y-0">
          @for (item of contents; track item.id) {
            <li>
              <a
                [routerLink]="[]"
                [fragment]="item.id"
                class="tag inline-flex min-h-[44px] items-center gap-2 py-3 text-ink-muted hover:text-ink motion-safe:transition-colors motion-safe:duration-1"
              >
                <span class="shrink-0 whitespace-nowrap">{{ item.tag }}</span>&ngsp;
                <span class="normal-case">{{ item.key | translate: item.params }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
    }
  </div>
</div>
