[build]
  # Pin the toolchain: Angular 22 needs Node ^22.22.3 || ^24.15.0 || >=26, and
  # without this Netlify installed dependencies on Node 18 and then built on 22.
  environment = { NODE_VERSION = "24" }
  command = "npm run build"
  publish = "www/browser"

# Prerendered routes are real files (e.g. about-us/index.html); Netlify only
# applies a non-forced (no "!") redirect when no file matches, so this
# fallback serves the CSR shell solely for unknown routes. It answers 404 so
# crawlers do not index unknown URLs as pages; the app boots the same on a
# 404 response.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 404

# Content-hashed filenames, so a new build is a new URL: the browser may keep
# these forever. index.html and the other routes' HTML stay on Netlify's
# revalidating default, so a deploy is picked up on the next request.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
