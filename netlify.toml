[build]
  command = "npm run build"
  publish = "www/browser"

# Prerendered routes are real files (e.g. about-us/index.html); Netlify only
# applies a non-forced (no "!") redirect when no file matches, so this
# fallback serves the CSR shell solely for unknown routes. It answers 404 so
# crawlers do not index unknown URLs as pages; the app boots the same on a
# 404 response.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 404
